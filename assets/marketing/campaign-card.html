<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>青缝长图拼接宣传卡</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        overflow: hidden;
        background:
          radial-gradient(circle at 85% 8%, rgba(8, 169, 155, 0.16), transparent 26%),
          linear-gradient(160deg, #f8fcfb 0%, #edf8f6 100%);
        color: #102521;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      }
      .poster {
        width: 100%;
        height: 100%;
        padding: 6.5% 7% 5%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .eyebrow {
        color: #078e83;
        font-size: clamp(22px, 2.4vw, 34px);
        font-weight: 750;
        letter-spacing: 0.08em;
      }
      h1 {
        margin: 1.8% 0 0;
        font-size: clamp(50px, 6.4vw, 84px);
        line-height: 1.12;
        text-align: center;
        letter-spacing: -0.03em;
      }
      .subtitle {
        margin-top: 2.2%;
        color: #526561;
        font-size: clamp(23px, 2.7vw, 36px);
        font-weight: 600;
        text-align: center;
      }
      .demo {
        width: 100%;
        margin-top: 5%;
        display: grid;
        grid-template-rows: auto auto auto;
        gap: 2.3vh;
        align-items: center;
      }
      .label {
        display: inline-flex;
        justify-self: center;
        padding: 9px 24px;
        border-radius: 999px;
        background: #d9f4ef;
        color: #067a70;
        font-size: clamp(19px, 2vw, 28px);
        font-weight: 750;
      }
      .before {
        position: relative;
        width: min(86vw, 850px);
        height: min(24vh, 300px);
        justify-self: center;
      }
      .crop {
        position: absolute;
        top: 0;
        width: 48%;
        height: 78%;
        overflow: hidden;
        border: 6px solid #ffffff;
        border-radius: 24px;
        background-image: url("./source-qingfeng-panorama.png");
        background-repeat: no-repeat;
        background-size: 227.56% 100%;
        box-shadow: 0 20px 40px rgba(20, 64, 57, 0.18);
      }
      .crop.one { left: 0; background-position: 0% 50%; transform: rotate(-3deg); }
      .crop.two { left: 26%; top: 10%; background-position: 50% 50%; z-index: 2; }
      .crop.three { right: 0; top: 20%; background-position: 100% 50%; transform: rotate(3deg); }
      .overlap-mark {
        position: absolute;
        z-index: 4;
        top: 57%;
        left: 42%;
        padding: 8px 14px;
        border: 3px dashed #ffffff;
        border-radius: 12px;
        background: rgba(7, 142, 131, 0.88);
        color: #ffffff;
        font-size: clamp(16px, 1.7vw, 23px);
        font-weight: 750;
      }
      .arrow {
        justify-self: center;
        color: #08a99b;
        font-size: clamp(44px, 5vw, 70px);
        font-weight: 900;
        line-height: 1;
      }
      .after {
        width: min(88vw, 900px);
        justify-self: center;
        overflow: hidden;
        border: 7px solid #ffffff;
        border-radius: 28px;
        background: #ffffff;
        box-shadow: 0 22px 55px rgba(20, 64, 57, 0.16);
      }
      .after img { display: block; width: 100%; height: auto; }
      .feature-row {
        width: 100%;
        margin-top: auto;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 14px;
      }
      .feature {
        padding: 12px 22px;
        border: 2px solid rgba(8, 169, 155, 0.18);
        border-radius: 999px;
        background: rgba(255,255,255,0.82);
        color: #27423d;
        font-size: clamp(18px, 2vw, 27px);
        font-weight: 700;
      }
      .footer {
        width: 100%;
        margin-top: 3.2%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .brand {
        font-size: clamp(27px, 3.2vw, 42px);
        font-weight: 800;
        text-align: center;
      }
      .brand small {
        display: block;
        margin-top: 8px;
        color: #657571;
        font-size: 0.62em;
        font-weight: 600;
      }
      .qr-window {
        display: none;
        position: relative;
        width: 230px;
        height: 230px;
        overflow: hidden;
        border: 8px solid #ffffff;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 14px 34px rgba(20, 64, 57, 0.16);
      }
      body.qr .qr-window { display: block; }
      .qr-window img {
        position: absolute;
        width: 520px;
        max-width: none;
        left: -145px;
        top: -593px;
      }
      body:not(.qr) .brand small { display: none; }

      @media (max-aspect-ratio: 4/3) {
        body.qr .poster { padding-top: 4.2%; padding-bottom: 2.5%; }
        body.qr h1 { margin-top: 1%; font-size: clamp(46px, 5.8vw, 68px); }
        body.qr .subtitle { margin-top: 1.2%; font-size: clamp(21px, 2.5vw, 31px); }
        body.qr .demo { margin-top: 2.5%; gap: 1.1vh; }
        body.qr .before { height: min(20vh, 250px); }
        body.qr .after { width: min(78vw, 790px); }
        body.qr .feature { padding: 9px 18px; font-size: clamp(17px, 1.8vw, 23px); }
        body.qr .footer { margin-top: 1.8%; }
        body.qr .brand { font-size: clamp(24px, 2.7vw, 34px); }
        body.qr .qr-window { width: 170px; height: 170px; border-width: 6px; border-radius: 18px; }
        body.qr .qr-window img { width: 385px; left: -107px; top: -439px; }
      }

      @media (min-aspect-ratio: 4/3) {
        .poster { padding: 4.5% 5%; align-items: flex-start; }
        h1 { font-size: clamp(48px, 4.5vw, 72px); text-align: left; }
        .subtitle { margin-top: 1.3%; font-size: clamp(22px, 2.1vw, 32px); text-align: left; }
        .demo {
          flex: 1;
          margin-top: 3%;
          display: grid;
          grid-template-columns: 1fr auto 1.08fr;
          grid-template-rows: auto 1fr;
          gap: 18px 30px;
        }
        .demo .label:first-child { grid-column: 1; grid-row: 1; }
        .before { grid-column: 1; grid-row: 2; width: 100%; height: 100%; min-height: 270px; }
        .arrow { grid-column: 2; grid-row: 2; align-self: center; transform: rotate(-90deg); }
        .after-label { grid-column: 3; grid-row: 1; }
        .after { grid-column: 3; grid-row: 2; width: 100%; align-self: center; }
        .feature-row { margin-top: 2.8%; justify-content: flex-start; }
        .footer {
          position: absolute;
          right: 4.5%;
          top: 5%;
          width: auto;
          margin: 0;
          justify-content: flex-end;
        }
        .brand { text-align: right; font-size: clamp(24px, 2.3vw, 36px); }
        .qr-window { width: 165px; height: 165px; border-width: 6px; border-radius: 18px; }
        .qr-window img { width: 375px; left: -105px; top: -428px; }
      }
    </style>
  </head>
  <body>
    <main class="poster">
      <div class="eyebrow">0.1.5 新增左右拼接</div>
      <h1>上下、左右都能拼</h1>
      <div class="subtitle">连续截图自动识别重复区域，拼成一张完整图片</div>

      <section class="demo">
        <div class="label">拼接前 · 有重复</div>
        <div class="before">
          <div class="crop one"></div>
          <div class="crop two"></div>
          <div class="crop three"></div>
          <div class="overlap-mark">重复区域</div>
        </div>
        <div class="arrow">↓</div>
        <div class="label after-label">拼接后 · 连续完整</div>
        <div class="after"><img src="./source-qingfeng-panorama.png" alt="" /></div>
      </section>

      <div class="feature-row">
        <div class="feature">2–20 张连续截图</div>
        <div class="feature">自动去重复叠</div>
        <div class="feature">图片仅在本机处理</div>
      </div>

      <footer class="footer">
        <div class="brand">
          青缝长图拼接
          <small>长按识别小程序码</small>
        </div>
        <div class="qr-window">
          <img src="./qingfeng-long-image-poster-v2.png" alt="" />
        </div>
      </footer>
    </main>
    <script>
      const query = new URLSearchParams(location.search);
      if (query.get("qr") === "1") document.body.classList.add("qr");
    </script>
  </body>
</html>
